services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx_config/custom.conf:/etc/nginx/conf.d/custom.conf:ro
    networks:
      - app-network
    restart: always

  # Local dev: you can keep it but DO NOT try to get public certs
  nginx-proxy-letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-letsencrypt
    depends_on:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx_config/custom.conf:/etc/nginx/conf.d/custom.conf:ro
      - acme:/etc/acme.sh
    environment:
      DEFAULT_EMAIL: b6640583@g.sut.ac.th
      NGINX_PROXY_CONTAINER: nginx-proxy
      # ✅ IMPORTANT: prevent acme from trying to validate domains on localhost
      ACME_CA_URI: https://acme-staging-v02.api.letsencrypt.org/directory
    networks:
      - app-network
    restart: always

  db:
    image: postgres:15-alpine
    container_name: se68_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: se68_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app-network

  socket:
    build: ./frontend/socket-server
    container_name: se68_socket
    restart: always
    expose:
      - "3001"
    ports:
      - "3001:3001"
    environment:
      # ✅ local frontend URL
      FRONTEND_URL: http://localhost:5173

      # (keep your existing fields; not used for localhost testing)
      VIRTUAL_HOST: socket.capstonehub.me
      VIRTUAL_PORT: 3001
      # ✅ disable le host in local
      LETSENCRYPT_HOST: ""
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: se68_backend
    env_file:
      - .env
    restart: always
    depends_on:
      - db
      - minio
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/lib:/app/lib
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable

      # ✅ local frontend URL
      FRONTEND_URL: http://localhost:5173

      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USERNAME: ${SMTP_USERNAME}

      SOCKET_SERVICE_URL: "http://socket:3001"
      GIN_MODE: release
      APP_ENV: production

      # ✅ cookies must match localhost
      COOKIE_DOMAIN: localhost

      # (keep your existing fields; not used for localhost testing)
      VIRTUAL_HOST: api.capstonehub.me
      VIRTUAL_PORT: 8080
      # ✅ disable le host in local
      LETSENCRYPT_HOST: ""
    expose:
      - "8080"
    ports:
      - "8080:8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        # ✅ compile-time env for Next build
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    container_name: se68_frontend
    restart: always
    expose:
      - "5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - socket
    environment:
  
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001

      VIRTUAL_HOST: capstonehub.me,www.capstonehub.me
      VIRTUAL_PORT: 5173

      LETSENCRYPT_HOST: ""
    networks:
      - app-network

volumes:
  pgdata:
  minio-data:
  certs:
  vhost:
  html:
  acme:

networks:
  app-network:
    driver: bridge
