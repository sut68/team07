version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------------
  db:
    image: postgres:15-alpine 
    container_name: dev-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app-network

  # -------------------------------------------------------------------
  # 2. Go Backend Service (Development Mode with Air)
  # -------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dev-backend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app 
      - /app/go.mod 
      - /app/go.sum
    stdin_open: true 
    tty: true
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      DB_HOST: db 
      DB_PORT: 5432
      DB_SSLMODE: disable
      SECRET_KEY: ${SECRET_KEY}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL}
      RESET_TOKEN_TTL: ${RESET_TOKEN_TTL}
      REFRESH_COOLDOWN: ${REFRESH_COOLDOWN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USERNAME: ${SMTP_USERNAME}
      GIN_MODE: release
      PORT: 8080
    depends_on:
      - db
    networks:
      - app-network

  # -------------------------------------------------------------------
  # 3. Frontend Service (Vite/Next.js/React - ใช้ 5173:5173)
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dev-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://backend:8080 
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:
  
networks:
  app-network:
    driver: bridge